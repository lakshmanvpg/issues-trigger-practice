name: Terraform Deployment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform-deploy:
    name: Terraform Deployment
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read infrastructure configuration
        id: config
        shell: bash
        run: |
          ENVIRONMENT=$(awk -F': ' '/^environment:/ {print $2}' infrastructure.yaml)
          REGION=$(awk -F': ' '/^region:/ {print $2}' infrastructure.yaml)
          OPERATION=$(awk -F': ' '/^operation:/ {print $2}' infrastructure.yaml)

          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"
          echo "region=$REGION" >> "$GITHUB_OUTPUT"
          echo "operation=$OPERATION" >> "$GITHUB_OUTPUT"

          echo "======================================"
          echo "Infrastructure Configuration"
          echo "======================================"
          echo "Environment : $ENVIRONMENT"
          echo "Region      : $REGION"
          echo "Operation   : $OPERATION"
          echo "======================================"

      - name: Validate infrastructure configuration
        shell: bash
        run: |
          if [[ -z "${{ steps.config.outputs.environment }}" ]]; then
            echo "Environment is missing"
            exit 1
          fi

          if [[ -z "${{ steps.config.outputs.region }}" ]]; then
            echo "Region is missing"
            exit 1
          fi

          if [[ "${{ steps.config.outputs.operation }}" != "plan" &&
                "${{ steps.config.outputs.operation }}" != "apply" &&
                "${{ steps.config.outputs.operation }}" != "destroy" ]]; then
            echo "Invalid Terraform operation:"
            echo "${{ steps.config.outputs.operation }}"
            echo "Allowed values: plan, apply, destroy"
            exit 1
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Plan
        if: steps.config.outputs.operation == 'plan'
        working-directory: terraform
        run: |
          echo "Running Terraform PLAN"

          terraform plan \
            -var="environment=${{ steps.config.outputs.environment }}" \
            -var="region=${{ steps.config.outputs.region }}"

      - name: Terraform Apply
        if: steps.config.outputs.operation == 'apply'
        working-directory: terraform
        run: |
          echo "Running Terraform APPLY"

          terraform apply -auto-approve \
            -var="environment=${{ steps.config.outputs.environment }}" \
            -var="region=${{ steps.config.outputs.region }}"

      - name: Terraform Destroy
        if: steps.config.outputs.operation == 'destroy'
        working-directory: terraform
        run: |
          echo "Running Terraform DESTROY"

          terraform destroy -auto-approve \
            -var="environment=${{ steps.config.outputs.environment }}" \
            -var="region=${{ steps.config.outputs.region }}"